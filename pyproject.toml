[project]
name = "mdany"
version = "0.1.0.dev0"
description = "Convert a set of Markdown documents into a PDF / DOCX submission package"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "panflute>=2.3",
    "pypandoc_binary>=1.13",
    "weasyprint>=62",
]

[project.scripts]
mdany = "mdany.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pypdf>=4",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdany"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
