name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: System packages (weasyprint, CJK fonts, graphviz, rsvg-convert, pdffonts)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-cjk graphviz librsvg2-bin poppler-utils
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  # Windows: the same setup as README, Install (MSYS2 for pango, graphviz, rsvg-convert).
  test-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false        # use the MSYS2 that the runner has at C:\msys64
          install: >-
            mingw-w64-x86_64-pango
            mingw-w64-x86_64-graphviz
            mingw-w64-x86_64-librsvg
            mingw-w64-x86_64-poppler
      - name: Put MSYS2 tools on PATH
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "WEASYPRINT_DLL_DIRECTORIES=C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run mdany doctor
      - run: uv run pytest -q
