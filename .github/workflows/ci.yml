name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: System packages (weasyprint, CJK fonts, graphviz, rsvg-convert, pdffonts)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-cjk graphviz librsvg2-bin poppler-utils
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
